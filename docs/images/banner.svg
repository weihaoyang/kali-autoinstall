<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="kali-autoinstall — unattended Kali installer ISO builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060911"/>
      <stop offset="0.55" stop-color="#0b1526"/>
      <stop offset="1" stop-color="#08202e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1d3557" stroke-width="1" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <circle cx="1140" cy="40" r="200" fill="#0ea5e9" opacity="0.10"/>
  <circle cx="90" cy="300" r="170" fill="#22d3ee" opacity="0.07"/>

  <rect x="0" y="0" width="6" height="320" fill="url(#accent)"/>

  <text x="80" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="18" letter-spacing="6" fill="#5eead4" opacity="0.9">PRESEED · GRUB · XORRISO</text>

  <text x="76" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="76" font-weight="700" fill="#e6f6ff" filter="url(#glow)">kali-autoinstall</text>

  <text x="80" y="238" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="27" fill="#b8d9ee">把官方 Kali ISO 变成零交互安装盘</text>

  <text x="80" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="17" fill="#7c9cb5">One command. Zero prompts. A ready-to-hack lab in minutes.</text>

  <g font-family="ui-monospace, Menlo, monospace" font-size="15">
    <rect x="900" y="140" width="132" height="34" rx="17" fill="#0f2a3d" stroke="#1f6f8b"/>
    <text x="966" y="162" text-anchor="middle" fill="#7dd3fc">arm64 / amd64</text>
    <rect x="1050" y="140" width="132" height="34" rx="17" fill="#0f2a3d" stroke="#1f6f8b"/>
    <text x="1116" y="162" text-anchor="middle" fill="#7dd3fc">UEFI + BIOS</text>
    <rect x="900" y="188" width="120" height="34" rx="17" fill="#0f2a3d" stroke="#1f6f8b"/>
    <text x="960" y="210" text-anchor="middle" fill="#7dd3fc">MIT</text>
    <rect x="1038" y="188" width="144" height="34" rx="17" fill="#0f2a3d" stroke="#1f6f8b"/>
    <text x="1110" y="210" text-anchor="middle" fill="#7dd3fc">Kali 2026.3</text>
  </g>
</svg>
