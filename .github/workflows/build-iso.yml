name: build-iso

on:
  workflow_dispatch:
    inputs:
      kali_version:
        description: "Kali version, e.g. 2026.3"
        required: true
        default: "2026.3"
      arch:
        description: "Target architecture"
        type: choice
        options: [arm64, amd64]
        default: arm64
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax + shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          bash -n scripts/*.sh
          shellcheck -S warning scripts/*.sh

  build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KALI_VERSION: ${{ github.event.inputs.kali_version || '2026.3' }}
      ARCH: ${{ github.event.inputs.arch || 'arm64' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install xorriso
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso

      - name: Download official Kali ISO and verify checksum
        run: |
          BASE="https://cdimage.kali.org/kali-${KALI_VERSION}"
          FILE="kali-linux-${KALI_VERSION}-installer-netinst-${ARCH}.iso"
          curl -fL --retry 5 --retry-delay 3 -o official.iso "${BASE}/${FILE}"
          curl -fsSL -o SHA256SUMS "${BASE}/SHA256SUMS"

          EXPECTED="$(grep " ${FILE}\$" SHA256SUMS | awk '{print $1}')"
          ACTUAL="$(sha256sum official.iso | awk '{print $1}')"
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          [ -n "$EXPECTED" ] && [ "$EXPECTED" = "$ACTUAL" ]
          ls -lh official.iso

      - name: Build unattended ISO
        run: |
          ./scripts/build-iso.sh \
            -i official.iso \
            -o "kali-auto-${ARCH}.iso" \
            --disk /dev/sda
          sha256sum "kali-auto-${ARCH}.iso" | tee "kali-auto-${ARCH}.iso.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: kali-auto-${{ env.ARCH }}-${{ env.KALI_VERSION }}
          path: |
            kali-auto-${{ env.ARCH }}.iso
            kali-auto-${{ env.ARCH }}.iso.sha256
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "kali-auto-${ARCH}.iso" --clobber
          else
            gh release create "$TAG" "kali-auto-${ARCH}.iso" \
              --title "Kali ${KALI_VERSION} ${ARCH} · unattended installer" \
              --notes "Built from the official Kali ${KALI_VERSION} netinst ISO by kali-autoinstall."
          fi
